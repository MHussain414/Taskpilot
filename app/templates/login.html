<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ app_name }} — Sign In</title>
  <meta name="description" content="{{ app_tagline }} — sign in to manage tasks, priorities, and progress." />
  <meta name="theme-color" content="#6366f1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body>
  <div class="login-page">
    <header class="login-header">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="{{ app_name }}" class="brand-logo" />
      <h1>{{ app_name }}</h1>
      <p>{{ app_short_desc }}</p>
    </header>

    <div class="terminal-card">
      <div class="terminal-titlebar">
        <div class="window-dots" aria-hidden="true">
          <span class="red"></span>
          <span class="yellow"></span>
          <span class="green"></span>
        </div>
        <span class="terminal-prompt">taskpilot@workspace:~$ signin</span>
      </div>
      <div class="terminal-body">
        <h2>Sign In</h2>
        {% if error %}
        <div class="flash-error">{{ error }}</div>
        {% endif %}
        <form class="login-form" method="post" action="{{ url_for('main.login') }}" autocomplete="off">
          <label for="email">Work email</label>
          <div class="input-wrap">
            <input
              type="email"
              id="email"
              name="email"
              value=""
              placeholder="name@company.com"
              required
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              name="password"
              value=""
              placeholder="Enter your password"
              required
              autocomplete="new-password"
            />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="forgot-row">
            <a href="#" onclick="return false;">Forgot password?</a>
          </div>
          <button type="submit" class="btn-signin">Sign In</button>
        </form>
        <p class="signup-line">Demo: use any work email and password to continue.</p>
      </div>
    </div>

    {% set footer_compact = true %}
    {% include '_footer.html' %}
  </div>
  <script>
    document.getElementById("togglePw").addEventListener("click", () => {
      const p = document.getElementById("password");
      p.type = p.type === "password" ? "text" : "password";
    });
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
  </script>
</body>
</html>
